            display: flex;

        }
        .category-tab {
            padding: 8px 16px;

            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;

        .category-tab.active {
            background-color: #409eff;

            border-color: #409eff;
        }
        .category-tab:hover:not(.active) {
            border-color: #409eff;
            color: #409eff;
        }
        
        .search-box {
            margin-bottom: 25px;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #search-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #search-input:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2);
        }
        
        .random-copy-btn {
            padding: 12px 20px;
            background-color: #67c23a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        
        .random-copy-btn:hover {
            background-color: #52af3a;
        }
        
        .random-copy-btn.copied {
            background-color: #52af3a;
        }
        
        .list-container {
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        
        .item:hover {
            background-color: #f8f9fa;
        }
        
        .item:last-child {
            border-bottom: none;
        }
        
        .item-text {
            flex: 1;
            color: #333;
            font-size: 15px;
            word-break: break-all;
        }
        
        .copy-btn {
            padding: 6px 12px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
            margin-left: 10px;
        }
        
        .copy-btn:hover {
            background-color: #337ecc;
        }
        
        .copy-btn.copied {
            background-color: #67c23a;
        }
        
        .no-result {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 16px;
        }
        
        /* 随机复制内容展示区域 */
        .copied-content {
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background-color: #f8f9fa;
            margin-top: 15px;
            display: none;
        }
        
        .copied-content.show {
            display: block;
        }
        
        .copied-content-title {
            font-size: 15px;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .copied-content-text {
            font-size: 15px;
            color: #333;
            line-height: 1.5;
            word-break: break-all;
        }
        
        /* 临时文本域样式（隐藏） */
        .temp-copy-area {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            z-index: -1;
        }

            width: 6px;

        }

            background: #c1c1c1;
            border-radius: 3px;
        }

            background: #a8a8a8;
        }

        const categoryTabs = document.querySelectorAll('.category-tab');

        // 初始化渲染列表
        renderList();

        // 分类切换事件
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // 切换选中样式
                categoryTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                // 更新当前分类
                currentCategory = this.getAttribute('data-category');
                // 重新渲染
                renderList();
            });
        });

        // 绑定随机复制按钮事件
        randomCopyBtn.addEventListener('click', function() {
            const btn = this;
            // 获取当前筛选后的数据（分类+关键词）
            const currentData = getFilteredData();
            
            if (currentData.length === 0) {
                alert('当前无可用内容可复制！');
                return;
            }
            
            // 随机选择一条内容
            const randomIndex = Math.floor(Math.random() * currentData.length);
            const randomText = currentData[randomIndex].text;
            
            // 强制使用兼容方案复制
            tempCopyArea.value = randomText;
            tempCopyArea.select();
            tempCopyArea.setSelectionRange(0, randomText.length);
            
            try {
                const isSuccess = document.execCommand('copy');
                if (isSuccess) {
                    copiedContentText.textContent = randomText;
                    copiedContent.classList.add('show');
                    
                    btn.textContent = '已复制 ✔';
                    btn.classList.add('copied');
                    
                    setTimeout(() => {
                        btn.textContent = '随机复制一条';
                        btn.classList.remove('copied');
                    }, 2000);
                    
                    setTimeout(() => {
                        copiedContent.classList.remove('show');
                    }, 5000);
                    
                    tempCopyArea.blur();
                } else {
                    throw new Error('复制命令执行失败');
                }
            } catch (err) {
                alert(`随机复制失败，请手动复制：\n${randomText}`);
                console.error('随机复制失败:', err);
            }
        });

        // 搜索输入事件监听
        searchInput.addEventListener('input', function() {
            renderList();
        });

        // 获取筛选后的数据（分类 + 搜索关键词）
        function getFilteredData() {
            const keyword = searchInput.value.trim().toLowerCase();
            let filtered = contentData;
            
            // 分类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }
            
            // 关键词筛选
            if (keyword) {
                filtered = filtered.filter(item => item.text.toLowerCase().includes(keyword));
            }
            
            return filtered;
        }

        // 渲染列表函数
        function renderList() {
            const data = getFilteredData();
            
            if (data.length === 0) {
                contentList.innerHTML = '<div class="no-result">暂无匹配内容</div>';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const num = index + 1;
                html += `
                    <div class="item">
                        <span class="item-text">${num}\t${item.text}</span>
                        <button class="copy-btn" data-text="${item.text}">复制</button>
                    </div>
                `;
            });
            contentList.innerHTML = html;
            bindCopyEvents();
        }

        // 绑定复制事件（兼容版）
        function bindCopyEvents() {
            const copyBtns = document.querySelectorAll('.copy-btn');
            copyBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const text = this.getAttribute('data-text');
                    const originalText = this.textContent;
                    
                    try {
                        tempCopyArea.value = text;
                        tempCopyArea.select();
                        tempCopyArea.setSelectionRange(0, text.length);
                        
                        const isSuccess = document.execCommand('copy');
                        if (isSuccess) {
                            copiedContentText.textContent = text;
                            copiedContent.classList.add('show');
                            setTimeout(() => {
                                copiedContent.classList.remove('show');
                            }, 5000);
                            
                            showCopySuccess(this);
                            tempCopyArea.blur();
                        } else {
                            throw new Error('复制失败');
                        }
                    } catch (err) {
                        alert(`复制失败，请手动复制：\n${text}`);
                        console.error('复制失败:', err);
                    }
                });
            });
        }

        // 显示复制成功状态
        function showCopySuccess(btn) {
            btn.textContent = '已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '复制';
                btn.classList.remove('copied');
            }, 800);
        }
    </script>
</body>
</html>

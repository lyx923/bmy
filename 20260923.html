function shortName(n){ return n.replace(/(特别行政区|自治区|省|市|维吾尔|壮族|回族)/g,''); }
const SHORT2FULL = {};
const PROVINCE_CENTER = {};
for (const full in REGION_DATA){
  SHORT2FULL[shortName(full)] = full;
  const firstCity = Object.keys(REGION_DATA[full])[0];
  PROVINCE_CENTER[full] = REGION_DATA[full][firstCity];
}

const LABEL_OFFSET = {
  "河北省":         [-14, 18],
  "甘肃省":         [-30, -14],
  "香港特别行政区": [0, 30],
  "澳门特别行政区": [0, 30],
  "北京市":         [-6, -2],
  "天津市":         [12, 6],
  "内蒙古自治区":   [8, -6]
};
const LABEL_TEXT = {
  "香港特别行政区": "香港",
  "澳门特别行政区": "澳门"
};

function matchProvince(geoName){ return SHORT2FULL[shortName(geoName)] || null; }

const CITY_INDEX = [];
for (const prov in REGION_DATA){
  for (const city in REGION_DATA[prov]){
    const c = REGION_DATA[prov][city];
    CITY_INDEX.push({ name: city, lng: c[0], lat: c[1], province: prov });
  }
}
CITY_INDEX.sort((a,b)=> b.name.length - a.name.length);

function geocode(addr){
  let best = null, bestIdx = -1;
  for (const c of CITY_INDEX){
    const i = addr.indexOf(c.name);
    if (i > bestIdx || (i === bestIdx && i >= 0 && best && c.name.length > best.name.length)){
      best = c; bestIdx = i;
    }
  }
  if (best) return best;
  for (const full in REGION_DATA){
    if (addr.includes(shortName(full))){
      const fc = Object.keys(REGION_DATA[full])[0];
      const c = REGION_DATA[full][fc];
      return { name: fc, lng: c[0], lat: c[1], province: full };
    }
  }
  return null;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const points = [];
const overseasPoints = [];
const provinceStats = {};
let activeProvince = null;
const OVERSEAS_KEY = "__overseas__";

function buildPoints(){
  MALLS.forEach((raw, idx) => {
    let name = raw, addr = raw, time = '待定';
    const at = raw.indexOf('@');
    if (at > -1){
      name = raw.slice(0, at).trim();
      const rest = raw.slice(at + 1).trim();
      const at2 = rest.lastIndexOf('@');
      if (at2 > -1){
        addr = rest.slice(0, at2).trim();
        time = rest.slice(at2 + 1).trim();
      } else { addr = rest; }
    }
    const loc = geocode(addr);
    if (!loc){
      console.warn('[无法定位] ', raw);
      return;
    }
    points.push({
      id: idx, name: name || addr, address: addr, time: time,
      lng: loc.lng, lat: loc.lat, city: loc.name, province: loc.province,
      overseas: false
    });
    provinceStats[loc.province] = (provinceStats[loc.province] || 0) + 1;
  });

  OVERSEAS_MALLS.forEach((raw, idx) => {
    let name = raw, addr = raw, time = '待定';
    const at = raw.indexOf('@');
    if (at > -1){
      name = raw.slice(0, at).trim();
      const rest = raw.slice(at + 1).trim();
      const at2 = rest.lastIndexOf('@');
      if (at2 > -1){
        addr = rest.slice(0, at2).trim();
        time = rest.slice(at2 + 1).trim();
      } else { addr = rest; }
    }
    overseasPoints.push({
      id: 'ov_' + idx, name: name || addr, address: addr, time: time,
      lng: null, lat: null, city: addr, province: OVERSEAS_KEY,
      overseas: true
    });
  });
}

const MAP_URLS = [
  'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
  'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json',
  'https://unpkg.com/echarts@4.9.0/map/json/china.json'
];
let chart = null;
let GEO = null;
const IS_MOBILE = () => window.innerWidth <= 768;
const INIT_ZOOM = () => IS_MOBILE() ? 0.95 : 1.15;
const LABEL_THRESHOLD = () => IS_MOBILE() ? 2.0 : 1.1;

/* ★ 点位尺寸（比之前更大，更容易点击） */
const POINT_SIZE = () => IS_MOBILE() ? 11 : 13;

let currentZoom = INIT_ZOOM();
let lastLabelState = null;
let zoomDebounce;

async function loadMapData(){
  for (const url of MAP_URLS){
    try{
      const res = await fetch(url);
      if (!res.ok) continue;
      const json = await res.json();
      if (json && json.features && json.features.length) return json;
    }catch(e){}
  }
  throw new Error('地图数据加载失败');
}

function colorFor(n){
  if (!n) return '#0E2A3A';
  if (n <= 2) return '#1B5566';
  if (n <= 7) return '#2E8496';
  if (n <= 14) return '#7FD4E0';
  if (n <= 25) return '#FFC42E';
  return '#FF9E2C';
}

function buildRegions(){
  if (!GEO) return [];
  const showAllLabels = currentZoom >= LABEL_THRESHOLD();

  return GEO.features.map(f => {
    const gn = f.properties.name;
    const full = matchProvince(gn);
    const n = full ? (provinceStats[full] || 0) : 0;
    const selected = full && full === activeProvince;
    const isBright = n >= 15;

    const labelConfig = {
      show: showAllLabels,
      color: isBright ? '#0A1F2A' : '#C8E4EC',
      fontSize: IS_MOBILE() ? 10 : 11,
      fontWeight: 700,
      textShadowColor: isBright ? 'rgba(255,255,255,.7)' : 'rgba(0,0,0,.65)',
      textShadowBlur: 3
    };
    if (LABEL_OFFSET[gn]) labelConfig.offset = LABEL_OFFSET[gn];
    if (LABEL_TEXT[gn])   labelConfig.formatter = LABEL_TEXT[gn];

    return {
      name: gn,
      itemStyle: {
        areaColor: colorFor(n),
        borderColor: selected ? '#FFC42E' : 'rgba(127,212,224,.45)',
        borderWidth: selected ? 2.2 : 0.7,
        shadowColor: isBright ? 'rgba(255,196,46,.35)' : 'rgba(127,212,224,.15)',
        shadowBlur: 12
      },
      label: labelConfig,
      emphasis: {
        itemStyle: { areaColor: '#FFD966', borderColor:'#FFE9A8' },
        label: { show: true, color: '#0A1F2A', fontSize: 12, fontWeight: 800 }
      }
    };
  });
}

function updateZoomState(){
  try {
    const coordSys = chart.getModel().getComponent('geo', 0).coordinateSystem;
    if (coordSys && typeof coordSys.getZoom === 'function'){
      currentZoom = coordSys.getZoom();
    }
  } catch(e){}

  const show = currentZoom >= LABEL_THRESHOLD();
  if (lastLabelState !== show){
    lastLabelState = show;
    chart.setOption({ geo: { regions: buildRegions() } });
  }
}

function initChart(){
  lastLabelState = currentZoom >= LABEL_THRESHOLD();

  chart = echarts.init(document.getElementById('map'), null, { renderer: 'canvas' });
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',

      textStyle: { color: '#E5F4F7', fontSize: 12 },
      formatter: function(params){
        if (params.componentType === 'geo'){
          const full = matchProvince(params.name);
          const n = full ? (provinceStats[full] || 0) : 0;
          return '<div style="font-weight:800;font-size:13px;color:#7FD4E0">' + escapeHtml(full || params.name) + '</div>' +
                 '<div style="color:#FFC42E;margin-top:5px;font-weight:700">大屏数量：' + n + ' 个</div>' +
                 (n ? '<div style="color:#7FA8BC;margin-top:3px;font-size:11px">点击查看该省点位</div>' : '');
        }

                 escapeHtml(p.address) + '</div>';
        }
        return '';
      }
    },
    geo: {
      map: 'china', roam: true, zoom: INIT_ZOOM(), center: [104.5, 35.5],
      scaleLimit: { min: 0.7, max: 40 },
      itemStyle: {
        areaColor: '#0E2A3A',

  /* ★ 关键：点击逻辑
     - 点击具体点位 → 聚焦该点位
     - 点击省份（有数据）→ 如果没聚焦过这个省份，则聚焦；如果已经在看这个省份，不缩小（忽略）
     - 点击空白 / 无数据区域 → 完全忽略
     缩小地图只能通过「返回全国视图」按钮
  */
  chart.on('click', function(params){
    if (params.componentType === 'geo'){
      const full = matchProvince(params.name);
      if (full && provinceStats[full]){
        /* 只在「切换到其他省份」时聚焦；已经在该省份时不缩小 */
        if (activeProvince !== full){
          focusProvince(full);
        }
      }
      /* 点击空白 / 无数据区域：什么也不做，保持视图 */
      return;
    }
    if (params.componentType === 'series' && params.data && params.data.raw){
      const p = params.data.raw;
      focusPoint(p);
      const el = document.querySelector('.item[data-id="' + p.id + '"]');
      if (el){ setActiveItem(el); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      closeMobileMenu();
    }
  });

  window.addEventListener('resize', () => {
    chart.resize();
    clearTimeout(zoomDebounce);
    zoomDebounce = setTimeout(updateZoomState, 120);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { chart.resize(); updateZoomState(); }, 260);
  });
}

function focusProvince(full){
  activeProvince = full;
  currentZoom = IS_MOBILE() ? 3.6 : 4.5;
  lastLabelState = currentZoom >= LABEL_THRESHOLD();
  const c = PROVINCE_CENTER[full] || [104.5, 35.5];
  chart.setOption({ geo: { center: c, zoom: currentZoom, regions: buildRegions() } });
  chart.setOption({ series: [{ id: 'focus', data: [] }] });
  renderList(full);
}
function focusPoint(p){
  currentZoom = IS_MOBILE() ? 6 : 8;
  lastLabelState = currentZoom >= LABEL_THRESHOLD();
  chart.setOption({
    geo: { center: [p.lng, p.lat], zoom: currentZoom, regions: buildRegions() },
    series: [{ id: 'focus', data: [{ name: p.name, value: [p.lng, p.lat] }] }]
  });
}
function resetView(){
  activeProvince = null;
  currentZoom = INIT_ZOOM();
  lastLabelState = currentZoom >= LABEL_THRESHOLD();
  chart.setOption({
    geo: { center: [104.5, 35.5], zoom: currentZoom, regions: buildRegions() },
    series: [{ id: 'focus', data: [] }]
  });
  renderList();
  const cur = document.querySelector('.item.active'); if (cur) cur.classList.remove('active');
}

/* =========================================================
   ⑥  侧边列表
   ========================================================= */
const listEl = document.getElementById('list');
const searchInput = document.getElementById('search');

function setActiveItem(el){
  const cur = listEl.querySelector('.item.active');
  if (cur) cur.classList.remove('active');
  if (el) el.classList.add('active');
}

const toastEl = document.getElementById('overseasToast');
let toastTimer = null;
function showOverseasToast(p){
  const flag = FLAG_MAP[p.address] || '🌍';
  document.getElementById('toastFlag').textContent = flag;
  document.getElementById('toastName').textContent = p.name;
  document.getElementById('toastCountry').textContent = p.address;
  document.getElementById('toastTime').textContent = p.time;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function renderList(provinceFilter){
  const kw = (searchInput.value || '').trim().toLowerCase();
  const groups = new Map();

  points.forEach(p => {
    if (provinceFilter && p.province !== provinceFilter) return;
    const text = (p.name + p.address + p.city + p.province + p.time).toLowerCase();
    if (kw && text.indexOf(kw) === -1) return;
    if (!groups.has(p.province)) groups.set(p.province, []);
    groups.get(p.province).push(p);
  });

  const overseasMatched = overseasPoints.filter(p => {
    if (kw){
      const text = (p.name + p.address + p.time).toLowerCase();
      if (text.indexOf(kw) === -1) return false;
    }
    return true;
  });

  const provs = Array.from(groups.keys()).sort((a, b) => groups.get(b).length - groups.get(a).length);

  let html = '';

  if (overseasMatched.length && (!provinceFilter || provinceFilter === OVERSEAS_KEY)){
    const isActive = activeProvince === OVERSEAS_KEY;
    html += '<div class="pgroup overseas' + (isActive ? ' active' : '') + '">' +
              '<div class="phead" data-prov="' + OVERSEAS_KEY + '">' +
                '<span class="pname"><span class="globe">🌍</span>海外应援</span>' +
                '<span class="pcount">' + overseasMatched.length + '</span>' +
              '</div><div class="plist">';
    overseasMatched.forEach(p => {
      const flag = FLAG_MAP[p.address] || '🌍';
      html += '<div class="item" data-id="' + p.id + '">' +
                '<span class="dot"></span>' +
                '<span class="info">' +
                  '<span class="iname">' + flag + ' ' + escapeHtml(p.name) + '</span>' +
                  '<span class="iaddr">' + escapeHtml(p.address) + '</span>' +
                  '<span class="itime">' + escapeHtml(p.time) + '</span>' +
                '</span>' +
              '</div>';
    });
    html += '</div></div>';
  }

  provs.forEach(prov => {
    const arr = groups.get(prov);
    html += '<div class="pgroup' + (prov === activeProvince ? ' active' : '') + '">' +
              '<div class="phead" data-prov="' + escapeHtml(prov) + '">' +
                '<span class="pname">' + escapeHtml(prov) + '</span>' +
                '<span class="pcount">' + arr.length + '</span>' +
              '</div><div class="plist">';
    arr.forEach(p => {
      html += '<div class="item" data-id="' + p.id + '" title="' + escapeHtml(p.address) + '">' +
                '<span class="dot"></span>' +
                '<span class="info">' +
                  '<span class="iname">' + escapeHtml(p.name) + '</span>' +
                  '<span class="itime">' + escapeHtml(p.time) + '</span>' +
                '</span>' +
              '</div>';
    });
    html += '</div></div>';
  });

  if (!html){
    listEl.innerHTML = '<div class="empty">没有匹配的点位</div>';
    return;
  }
  listEl.innerHTML = html;
}

listEl.addEventListener('click', function(e){
  const item = e.target.closest('.item');
  if (item){
    const id = item.dataset.id;
    if (String(id).startsWith('ov_')){
      const p = overseasPoints.find(x => String(x.id) === id);
      if (p){
        setActiveItem(item);
        showOverseasToast(p);
        closeMobileMenu();
      }
      return;
    }
    const p = points.find(x => String(x.id) === id);
    if (p){ focusPoint(p); setActiveItem(item); closeMobileMenu(); }
    return;
  }
  const head = e.target.closest('.phead');
  if (head){
    const prov = head.dataset.prov;
    if (prov === OVERSEAS_KEY){
      activeProvince = activeProvince === OVERSEAS_KEY ? null : OVERSEAS_KEY;
      renderList();
      return;
    }
    /* 侧边栏点击省份标题：仍然可以切换聚焦；再次点击同一个省份则返回全国 */
    if (activeProvince === prov) resetView(); else focusProvince(prov);
    closeMobileMenu();
  }
});
searchInput.addEventListener('input', () => renderList(activeProvince));
document.getElementById('btnReset').addEventListener('click', () => { resetView(); closeMobileMenu(); });

/* =========================================================
   ⑦  移动端抽屉
   ========================================================= */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('mobileOverlay');
const toggleBtn = document.getElementById('mobileToggle');

function openMobileMenu(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeMobileMenu(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
toggleBtn.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeMobileMenu() : openMobileMenu();
});
overlay.addEventListener('click', closeMobileMenu);

/* =========================================================
   ⑧  统计
   ========================================================= */
function updateStat(){
  const total = points.length + overseasPoints.length;
  const provCount = Object.keys(provinceStats).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statProv').textContent = provCount;
  document.querySelector('.side-head .sub').textContent =
    '全国 ' + points.length + ' 屏 + 海外 ' + overseasPoints.length + ' 屏 · 点击省份/点位，快速定位';
}

/* =========================================================
   ⑨  启动
   ========================================================= */
(async function(){
  const loadingEl = document.getElementById('loading');
  try{
    buildPoints();
    GEO = await loadMapData();
    echarts.registerMap('china', GEO);
    if (loadingEl) loadingEl.remove();
    initChart();
    renderList();
    updateStat();
    const missing = MALLS.length - points.length;
    if (missing > 0) console.warn('有 ' + missing + ' 条地址未能定位');
  }catch(err){
    console.error(err);
    if (loadingEl){
      loadingEl.innerHTML = '<div style="text-align:center;line-height:2;color:#FF8A8A">' +
        '地图数据加载失败：' + escapeHtml(err.message) + '<br/>' +
        '<span style="color:#7FA8BC;font-size:12px">请检查网络后刷新</span></div>';
    }
  }
})();
</script>
</body>
</html>
